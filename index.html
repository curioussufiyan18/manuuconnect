<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Chatbot</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; margin-top: 50px; }
        #chat-container { width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #chat-box { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 4px; }
        .user { background: #007bff; color: white; text-align: right; }
        .bot { background: #e9ecef; color: black; text-align: left; }
        input { width: 75%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 20%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <h3 style="text-align: center;">Community Assistant</h3>
    <div id="chat-box"></div>
    <div style="display: flex; justify-content: space-between;">
        <input type="text" id="user-input" placeholder="Ask something...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const message = inputField.value.trim();
        
        if (!message) return;

        // Display the user's message
        chatBox.innerHTML += `<div class="message user">${message}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Send the message to our Vercel serverless function
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            
            const data = await response.json();
            
            // Display the bot's response
            if (data.reply) {
                chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message bot">Error: Could not get a response.</div>`;
            }
        } catch (error) {
            chatBox.innerHTML += `<div class="message bot">Connection error. Please try again.</div>`;
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
