<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANUUConnect - AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 20px;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      margin-top: 5px;
      font-size: 14px;
      opacity: 0.9;
    }

    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
    }

    .user {
      justify-content: flex-end;
    }

    .bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #dcf8c6;
      color: #111;
    }

    .bot .bubble {
      background: #eeeeee;
      color: #111;
    }

    .input-area {
      display: flex;
      padding: 15px;
      border-top: 1px solid #ddd;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      border: none;
      background: #075e54;
      color: white;
      padding: 0 22px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
    }

    #sendButton:hover {
      background: #064c44;
    }

    #sendButton:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .typing {
      color: #777;
      font-style: italic;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h1>MANUUConnect</h1>
      <p>AI Assistant for Maulana Azad National Urdu University</p>
    </div>

    <div id="messages">

      <div class="message bot">
        <div class="bubble">
          Hello! 👋 I'm MANUUConnect.

          How can I help you with MANUU today?
        </div>
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Ask something about MANUU..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>

  <script>

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    function addMessage(text, sender) {

      const message = document.createElement("div");
      message.className = `message ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      bubble.textContent = text;

      message.appendChild(bubble);
      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      addMessage(message, "user");

      messageInput.value = "";

      sendButton.disabled = true;
      sendButton.textContent = "Thinking...";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "MANUUConnect is thinking...";
      typing.id = "typing";

      messages.appendChild(typing);

      messages.scrollTop = messages.scrollHeight;

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })

        });

        const data = await response.json();

        document.getElementById("typing")?.remove();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        addMessage(data.reply, "bot");

      } catch (error) {

        document.getElementById("typing")?.remove();

        addMessage(
          "Sorry, I couldn't connect to the AI right now. Please try again.",
          "bot"
        );

        console.error(error);

      } finally {

        sendButton.disabled = false;
        sendButton.textContent = "Send";

        messageInput.focus();

      }
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
</body>
</html>
